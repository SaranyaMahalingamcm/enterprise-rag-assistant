name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (offline, no credentials)
        run: python -m pytest

      - name: Evaluation smoke run
        run: python -m rag_assistant.eval --output-dir /tmp/eval-report
