[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Hybrid-retrieval RAG assistant with guardrails, citations and an evaluation harness (portfolio project on synthetic data)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Saranya Mahalingam" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/SaranyaMahalingamcm/enterprise-rag-assistant"

[tool.setuptools.packages.find]
include = ["rag_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/Header() defaults are idiomatic
